name: Build Windows .exe
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Absolute API base URL'
        required: true
        default: 'https://8f534ef1-8207-4796-ba88-d3414436c487-00-16zu2ahai7f64.sisko.replit.dev/api'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build EXE
        run: pnpm run build-windows -- --api-url=${{ github.event.inputs.api_url }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tojiktelecom-Fiber-GIS-Windows
          path: dist/*.exe
